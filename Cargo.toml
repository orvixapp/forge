[workspace]
members = [
    "crates/proto-acp",
    "crates/proto-bench",
    "crates/proto-buffer",
    "crates/proto-ghostty-vt",
    "crates/proto-ipc",
    "crates/proto-term-client",
    "crates/proto-termd",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
libloading = "0.8"
memmap2 = "0.9"
portable-pty = "0.9"
rmp-serde = "1"
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
