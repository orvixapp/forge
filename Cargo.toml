[workspace]
members = [
    "crates/proto-acp",
    "crates/proto-bench",
    "crates/proto-buffer",
    "crates/proto-ghostty-vt",
    "crates/proto-ipc",
    "crates/proto-term-client",
    "crates/proto-termd",
    "crates/forge-gui",
]
resolver = "3"
default-members = ["crates/forge-gui"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
gpui = "0.2.2"
libloading = "0.8"
memmap2 = "0.9"
portable-pty = "0.9"
rmp-serde = "1"
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# GPUI builds a retained element tree and Ghostty snapshots terminal state on
# every update. Unoptimized code makes ordinary `cargo run` unusably slow.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
