[package]
name = "forge-buffer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Text buffer of the Forge editor: rope, transactions, undo, selections and crash journal"

[dependencies]
encoding_rs = "0.8"
memmap2.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1"

# The read-only mmap in `large.rs` is the one unsafe block of the crate;
# clippy keeps the workspace levels.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
