# Product budgets from docs/ARCHITECTURE.md §5.2 and §29, meant for the
# reference machines in MACHINES.md. CI runners use thresholds.ci.toml.

[startup_empty]
p95_ms = 100.0
max_pss_kib = 81920

[idle]
duration_ms = 60000
max_frames = 0

[ipc_round_trip]
p95_ms = 1.0

[grid_full]
p95_ms = 4.0

[panes_20]
p95_ms = 2.0

[key_echo]
p95_ms = 8.0

[flood_input]
p95_ms = 16.0

# Phase 2 intermediate scale gate. The final R1 gate repeats this with 200
# terminals under the same 100 MiB daemon budget.
[termd_idle]
max_pss_kib = 102400

# Phase 3 editor budgets (ARCHITECTURE.md §29): keystroke → present with
# highlighting on a 10k-line file; opening a large log (includes ~120 ms
# of startup; product target 500 ms for the open alone); fuzzy over 1M
# paths; literal search of the workspace (≤ 1.2× ripgrep, checked by eye).
[editor_typing]
p95_ms = 3.0

[open_large_log]
p95_ms = 650.0

[fuzzy_1m_paths]
p95_ms = 10.0

[search_project_literal]
p95_ms = 400.0
