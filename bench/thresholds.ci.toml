# Regression budgets for GitHub-hosted Linux runners (Xvfb + lavapipe, no
# GPU, shared CPU). They catch order-of-magnitude regressions, not the
# product targets in thresholds.toml.

[startup_empty]
p95_ms = 1500.0
max_pss_kib = 262144

[idle]
duration_ms = 60000
max_frames = 0

[ipc_round_trip]
p95_ms = 5.0

[grid_full]
p95_ms = 40.0

[panes_20]
p95_ms = 20.0

[key_echo]
p95_ms = 40.0

[editor_typing]
p95_ms = 30.0

[open_large_log]
p95_ms = 5000.0

[fuzzy_1m_paths]
p95_ms = 100.0

[search_project_literal]
p95_ms = 4000.0

[agent_update_overhead]
p95_ms = 2.0

[agent_stream]
p95_ms = 60.0

[agent_parallel_typing]
p95_ms = 30.0
