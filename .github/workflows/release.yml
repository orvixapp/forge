name: release

# Builds the Linux installers (.deb and .tar.gz with install.sh) from a
# release build plus the pinned libghostty-vt and publishes them:
#   - run by hand (Actions tab → release → Run workflow, or
#     `gh workflow run release`): the rolling pre-release `dev`, replaced on
#     every run, at <repo>/releases/tag/dev;
#   - a `v*` tag: a proper release with generated notes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (default: Cargo version + git hash)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # ubuntu-24.04 links against glibc 2.39: the packages run on Ubuntu 24.04+,
    # Debian 13+, Fedora 40+, Arch and similar. Older distributions need a
    # build on an older base image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build dependencies (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libwayland-dev libx11-xcb-dev libvulkan-dev libasound2-dev libzstd-dev
      - name: libghostty-vt
        run: ./scripts/bootstrap-ghostty.sh
      - name: Release build
        run: cargo build --release -p forge-gui -p proto-termd
      - name: Package
        run: ./scripts/package-linux.sh "${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}"
      - name: Smoke test the tarball installer
        run: |
          set -eux
          prefix=$(mktemp -d)
          tar -xzf dist/forge-*-linux-x86_64.tar.gz -C "$prefix"
          "$prefix"/forge-*/install.sh --prefix "$prefix/opt"
          test -x "$prefix/opt/lib/forge/proto-termd"
          test -f "$prefix/opt/lib/forge/libghostty-vt.so"
          "$prefix/opt/bin/forge" --print-config-schema > /dev/null
          dpkg-deb --info dist/forge_amd64.deb
          # The hosted installer against this build, served from a local mirror.
          (cd dist && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          FORGE_RELEASE_URL=http://127.0.0.1:8765 ./install.sh --prefix "$prefix/hosted"
          "$prefix/hosted/bin/forge" --print-config-schema > /dev/null
          FORGE_RELEASE_URL=http://127.0.0.1:8765 ./install.sh --uninstall --prefix "$prefix/hosted"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-linux-x86_64
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS*.txt
          if-no-files-found: error
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --title "Forge $GITHUB_REF_NAME"
          --generate-notes dist/*.deb dist/*.tar.gz dist/SHA256SUMS*.txt
      - name: Rolling dev pre-release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          # One `dev` pre-release that always carries the latest manual build.
          gh release delete dev --yes --cleanup-tag || true
          git tag -f dev "$GITHUB_SHA"
          git push -f origin dev
          short=$(git rev-parse --short "$GITHUB_SHA")
          {
            echo "Linux x86_64 build from $GITHUB_SHA on $(date -u +%Y-%m-%d)."
            echo
            echo 'Install or update from a terminal (Debian/Ubuntu package, or a ~/.local install elsewhere):'
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | bash"
            echo '```'
            echo
            echo 'Options: `| bash -s -- --user` (no root, ~/.local), `--version dev`, `--uninstall`.'
            echo 'Manual: `sudo apt install ./forge_amd64.deb`, or unpack the tarball and run its `install.sh`.'
            echo 'Needs Vulkan drivers (`mesa-vulkan-drivers` on Debian/Ubuntu).'
          } > notes.md
          gh release create dev --prerelease --title "Forge dev build ($short)" \
            --notes-file notes.md dist/*.deb dist/*.tar.gz dist/SHA256SUMS*.txt
